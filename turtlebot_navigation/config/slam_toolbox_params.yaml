# slam_toolbox (online async) configuration for a TurtleBot 2 whose /scan
# comes from an Xtion/Astra depth camera via depthimage_to_laserscan.
#
# Based on slam_toolbox's mapper_params_online_async.yaml. Compared with a
# real lidar, this "scan" is narrow (~58 degrees) and short (0.45-4 m), so
# each scan sees far less of the room. The changes below make up for that by
# adding scans to the map more often and by keeping the laser range in line
# with what depthimage_to_laserscan actually publishes. Everything not listed
# keeps slam_toolbox's defaults.
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # Redraw the map every 2 s rather than 5 s, so it keeps up with driving.
    map_update_interval: 2.0
    resolution: 0.05
    restamp_tf: false
    # Must not exceed depthimage_to_laserscan's range_min/range_max.
    min_laser_range: 0.45
    max_laser_range: 4.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Add a scan every 0.2 m / ~11 degrees instead of 0.5 m / ~29 degrees:
    # with a narrow scan, consecutive scans would otherwise barely overlap,
    # especially while turning.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    # Without this, slam_toolbox only checks distance travelled and ignores
    # minimum_travel_heading, so turning in place never adds a scan. With a
    # ~58 degree "scan", turning in place is how the rest of a room is seen.
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 5.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
