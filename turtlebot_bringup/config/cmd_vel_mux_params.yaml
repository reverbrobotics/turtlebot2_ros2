# cmd_vel_mux configuration for turtlebot_bringup.
#
# Priorities mirror the ROS 1 turtlebot_bringup setup: the safety
# controller (bump/cliff/wheel-drop stop) always wins, followed by
# whatever teleop or navigation source is actively publishing.
cmd_vel_mux:
  ros__parameters:
    subscribers:
        safety_controller:
          topic:       "input/safety"
          timeout:     0.2
          priority:    100
          short_desc:  "Safety controller override (bump/cliff/wheel-drop stop)"
        teleop_keyboard:
          topic:       "input/teleop"
          timeout:     0.5
          priority:    10
          short_desc:  "Keyboard teleoperation (e.g. teleop_twist_keyboard)"
        navigation:
          topic:       "input/navigation"
          timeout:     0.5
          priority:    1
          short_desc:  "Navigation stack controller"
        default:
          topic:       "input/default"
          timeout:     0.1
          priority:    0
          short_desc:  "Default cmd_vel source, for controllers unaware of the mux"
